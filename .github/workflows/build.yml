name: Build

on:
  push:
    branches: [main, streaming-transcription]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Run RamblrKit tests
        working-directory: RamblrKit
        run: swift test

      # The app's build phase copies MediaRemoteAdapter from this package.
      - name: Install media-control
        run: brew install media-control

      # Ad-hoc signed (no Apple developer account needed) so it runs on Apple Silicon.
      - name: Build Ramblr.app
        run: |
          xcodebuild \
            -project Ramblr.xcodeproj \
            -scheme Ramblr \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO \
            build

      # Without hardened runtime, macOS won't reject the bundled Sparkle
      # framework for having a different signer than our ad-hoc signature.
      # Launch the app and make sure it doesn't crash at startup.
      - name: Smoke test launch
        run: |
          build/Build/Products/Release/Ramblr.app/Contents/MacOS/Ramblr > launch.log 2>&1 &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then
            echo "App is running after 8s"
            kill $PID
          else
            echo "App exited during startup:"
            cat launch.log
            exit 1
          fi

      - name: Package app
        run: ditto -c -k --keepParent build/Build/Products/Release/Ramblr.app Ramblr.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Ramblr-app
          path: Ramblr.zip
